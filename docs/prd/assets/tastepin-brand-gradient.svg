<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">맛핀 브랜드 그라데이션</title>
  <desc id="desc">Map Blue에서 Iris를 거쳐 Taste Coral로 이어지는 맛핀의 추천 그라데이션</desc>
  <defs>
    <linearGradient id="tastepinGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#246BFD"/>
      <stop offset="52%" stop-color="#6B63E8"/>
      <stop offset="100%" stop-color="#F05A4F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#182033" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="#F8FAFD"/>
  <rect x="48" y="44" width="1104" height="220" rx="36" fill="url(#tastepinGradient)" filter="url(#shadow)"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" fill="#FFFFFF">
    <text x="96" y="112" font-size="24" font-weight="700">Tastepin brand gradient</text>
    <text x="96" y="166" font-size="46" font-weight="800" letter-spacing="-1.5">저장한 맛집을 다시 찾는 지도</text>
    <text x="96" y="215" font-size="22" font-weight="600" opacity="0.9">Map Blue → Iris bridge → Taste Coral</text>
  </g>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="700">
    <circle cx="76" cy="310" r="12" fill="#246BFD"/>
    <text x="98" y="317" fill="#202124">Primary · #246BFD</text>

    <circle cx="420" cy="310" r="12" fill="#6B63E8"/>
    <text x="442" y="317" fill="#202124">Bridge · #6B63E8</text>

    <circle cx="736" cy="310" r="12" fill="#F05A4F"/>
    <text x="758" y="317" fill="#202124">Secondary · #F05A4F</text>
  </g>
</svg>
